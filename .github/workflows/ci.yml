name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A force-push to a PR branch previously left the superseded run executing to
# completion alongside the new one. Cancel superseded runs on PR refs; keep
# main pushes uncancelled so every landed commit gets a full verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Docs-only pull requests do not run the gate: a README wording change was
  # burning the full OS × Node matrix, the packed consumer installs, and the
  # cross-check for a diff nothing executes. The rules live in
  # .github/scripts/classify-change.sh, shared with native-rn-matrix.yml. The gate
  # jobs skip by condition, which GitHub reports as success, and `CI verdict` below
  # is the single required check either way.
  classify:
    name: Classify change
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs-only: ${{ steps.docs.outputs.docs-only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: docs
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/classify-change.sh "$EVENT" "$BASE_SHA" "$HEAD_SHA"

  changeset:
    name: Changeset for shipped changes
    # Pull requests only: the check compares against the base branch, and a push to
    # main has already been through this on its way in.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Its own job with full history rather than fetch-depth: 0 on the matrix, which
      # would make every leg clone the whole repository to serve one diff.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require a changeset when shipped source changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node packages/vitest-native/scripts/check-changeset.mjs "$BASE_SHA" "$HEAD_SHA"

  check:
    # Unique per leg: the two Node 20 legs differ only by RNTL, and GitHub resolves a
    # check name shared by two jobs ambiguously.
    name: Full gate (${{ matrix.os }}, Node ${{ matrix.node-version }}${{ matrix.rntl && format(', RNTL {0}', matrix.rntl) || '' }})
    needs: classify
    if: needs.classify.outputs.docs-only != 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        # RNTL 14 (the lockfile version) requires Node >=22.13, so the Node 20 legs
        # double as the lower-bound back-compat corners: they pin RNTL 12 and 13 — the
        # versions Node 20 users run — to prove the full supported peer range (>=12
        # <15) and the Node floor on every push. The hot runtime and cross-check are
        # calibrated on the current RNTL and run only on the RNTL 14 legs (step `if`s).
        include:
          - os: ubuntu-latest
            node-version: 20.19.4
            rntl: '12'
          - os: ubuntu-latest
            node-version: 20.19.4
            rntl: '13'
          - os: ubuntu-latest
            node-version: 22.13.0
          - os: macos-latest
            node-version: 22.13.0
          - os: windows-latest
            node-version: 22.13.0
          # Node 24 is the current release line and the matrix stopped at 22, which is
          # how a workspace-level Vitest mismatch went unnoticed locally for a whole
          # session. Everything runs here, hot runtime included.
          - os: ubuntu-latest
            node-version: 24.13.0

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node-version }}

      - name: Verify dependencies are pinned
        run: bun run lint:deps

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck

      # Lint/format/typecheck above run against the locked RNTL (14); pin the
      # back-compat leg to its target RNTL before building and running the suite.
      - name: Pin RNTL for the back-compat leg
        if: matrix.rntl
        run: bun add -d "@testing-library/react-native@${{ matrix.rntl }}" --cwd packages/vitest-native

      - name: Build
        run: bun run build

      - name: Enforce published package budget
        if: runner.os == 'Linux' && matrix.node-version == '22.13.0' && !matrix.rntl
        run: bun run --filter vitest-native check:size

      - name: React Native API coverage (pinned RN)
        # The README claims the mock engine covers every stable React Native export.
        # check-compat is what backs that claim, and it ran only in the weekly
        # compat-check workflow — against react-native@latest, never against the
        # version actually pinned here. So a pull request that moved the pinned RN
        # could add stable exports the mock does not cover and still go green, with
        # the gap surfacing days later as a canary failure against a different
        # version. One leg is enough: RN is identical across the matrix, only RNTL
        # varies. The canary keeps its own edge run.
        if: runner.os == 'Linux' && matrix.node-version == '22.13.0' && !matrix.rntl
        run: bun run --filter vitest-native check-compat

      - name: Test
        run: bun run test

      - name: Native engine tests
        run: bun run test:native

      - name: Native engine tests (forks pool)
        # When a project configures a VM pool the plugin throws and points at 'threads'
        # or 'forks'. Nothing ran the forks pool, so that advice was untested — and the
        # engine's module hooks have to install in a child process just as they do in a
        # worker thread. Cheap (a couple of seconds) for advice the plugin gives in an
        # error message.
        run: bun run test:native:forks

      - name: Native engine tests (navigation preset)
        run: bun run test:native:navigation

      - name: Native engine tests (Android)
        run: bun run test:native:android

      - name: Native engine remediation advice
        # The explainer tells users to add a package to `transform: [...]` when Node
        # cannot parse its source — the most common migration blocker. That advice was
        # only ever asserted as a substring of the error message; this applies it.
        run: bun run test:native:advice

      - name: Native engine tests (hot runtime)
        # The hot runtime rides @experimental Vitest internals (vitest/worker,
        # ThreadsPoolWorker, poolRunner) — the most churn-prone surface we depend
        # on, so gate it on every PR, not just the weekly matrix.
        #
        # Runs on the back-compat legs too. It used to skip them as "covered on the
        # RNTL 14 legs", which was wrong: the resident-module keep-list has entries
        # that only matter on older RNTL, and removing them fails this suite under
        # RNTL 13 while RNTL 14 stays green (see native/module-reset.mjs). The hot
        # runtime was in fact fine on RNTL 12/13 — nothing was checking.
        run: bun run test:native:hot

      - name: Native engine hot-runtime isolation
        if: ${{ !matrix.rntl }}
        run: bun run test:native:hot:isolation

      - name: Native engine hot-runtime soak and recycling
        if: ${{ !matrix.rntl }}
        run: bun run test:native:hot:soak

      - name: Cross-check (mock ≡ real RN) + fidelity report freshness
        # The cross-check is calibrated on the current RNTL (14); a few probes track
        # RNTL-version-specific real-RN behavior, so it runs only on the RNTL 14 legs.
        # fidelity:check runs the cross-check AND fails if the published fidelity
        # page/badge no longer match the live corpus (run `bun run fidelity:report`).
        if: ${{ !matrix.rntl }}
        run: bun run fidelity:check

      - name: Test example app
        run: bun run test:example

      - name: Check package exports
        if: runner.os == 'Linux' && matrix.node-version == '22.13.0'
        run: bun run check:exports

      # The Windows floor (22.13) predates registerHooks. Reuse the existing job
      # for a dependency-free modern-Node contract run, after all floor checks.
      - name: Modern Node for Windows loader-hook contracts
        if: runner.os == 'Windows'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.16.0

      - name: Windows synchronous loader-hook contracts
        if: runner.os == 'Windows'
        env:
          VN_CJS_DRAIN_RESEARCH: '1'
        run: node --test packages/vitest-native/validation/module-isolation/test-node-cjs-reset.mjs packages/vitest-native/validation/module-isolation/test-node-cjs-drain-contract.mjs

  # The packed, install-heavy gates that need one canonical leg (Linux, Node 22, the
  # locked RNTL). They ran one after another on that leg of `check`, which made it
  # the critical path of every run (9.1 min, against under 4 for every other leg, on
  # the run that motivated this split). As parallel cells, each starting from the
  # same build, the slowest cell sets the time instead of their sum. Cells are
  # balanced on measured step times: packed consumers about 3 min, the semantics
  # gate about 70 s per Vitest major, the hot-runtime and registry gates about 2 min
  # together. Minutes are not the constraint — standard runners are free for public
  # repositories (GitHub Actions billing docs) and no job waited in a queue.
  packed:
    name: Packed gate (${{ matrix.label }})
    needs: classify
    if: needs.classify.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - gate: consumers
            label: consumer projects
          - gate: vitest-semantics
            vitest: 5.0.1
            label: Vitest semantics, Vitest 5
          - gate: vitest-semantics
            vitest: 4.1.11
            label: Vitest semantics, Vitest 4 floor
          - gate: hot-runtime
            label: hot runtime and registry

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup
        with:
          node-version: 22.13.0

      # Every packed cell installs fixtures with npm. Node 22.13.0 bundles npm
      # 10.9.2, whose arborist crashes with "Cannot read properties of null (reading
      # 'edgesOut')" on these fixtures' dependency graphs. It is not this package:
      # a fixture with vitest-native removed entirely crashes the same way, and the
      # commit that passed on 2026-07-27 fails on re-run with no code change, so a
      # republished transitive dependency started tripping the bug. npm 11 installs
      # all of them. It runs first in every cell: on the old shared leg, the packed
      # CJS reset gate passed only because it happened to run after this step.
      - name: Use an npm without the arborist edgesOut bug
        run: npm install -g npm@11.20.0

      - name: Build
        run: bun run build

      - name: Hot runtime equals default engine at scale
        # The only check that compares the two engines file-for-file over a
        # generated app-shaped corpus, and the only one that fails on a
        # hot-specific correctness delta. It ran in no workflow and was absent from
        # prepublishOnly, so the invariant it protects survived on the habit of
        # running it by hand — while the code comments that cite its numbers named
        # it as the way to catch a regression the gated suites let through.
        if: matrix.gate == 'hot-runtime'
        run: bun run --filter vitest-native validate:hot-parity

      - name: Hot runtime preserves V8 and Istanbul coverage attribution
        # isolate:false is the scheduling signal for the custom hot pool, while
        # modules are reset per file inside the worker. Compare packed default/hot
        # maps and exact execution counts so that split cannot silently double-count
        # or lose an uncovered branch. One canonical Linux leg contains the install
        # cost without weakening the release invariant.
        if: matrix.gate == 'hot-runtime'
        run: bun run --filter vitest-native validate:coverage-parity

      - name: Safe automatic hot-runtime selection
        # A packed consumer proves both sides of the selector: bounded two-worker
        # native runs opt in, while one-worker, Jest-migration, and explicit-pool
        # configurations retain stock isolation and report the exact reason.
        if: matrix.gate == 'hot-runtime'
        run: bun run --filter vitest-native validate:hot-auto

      - name: Bounded cold registry compilation
        # Compile the same real RN graph in the Vite parent and in the production
        # child, require artifact parity and a material persistent-RSS reduction,
        # then race two cold children against one atomic cache. One stable Linux
        # leg owns the memory ratio; the unit matrix exercises the process
        # protocol, OOM retry and timeout on every supported OS/Node corner.
        if: matrix.gate == 'hot-runtime'
        run: bun run --filter vitest-native validate:registry-process

      - name: Packed CJS reset mutation control
        # One packed RN consumer, not another full matrix. Omitting the installed
        # drain must fail, proving that the positive gate reaches this reset seam.
        if: matrix.gate == 'hot-runtime'
        run: node packages/vitest-native/validation/module-isolation/run-packed-cjs-reset.mjs

      - name: Vitest semantics under the defaults (Vitest ${{ matrix.vitest }})
        # A packed project run the way Vitest users run it: config and CLI flags
        # (isolate, pool, workers, shard, retry, bail, related, coverage, projects, a
        # project root below the install, a read-only node_modules, the jsdom and
        # happy-dom environments, --typecheck, vitest bench, the HTML reporter) and watch
        # mode.
        # Each scenario asserts which runtime ran, Vitest's own outcome, and
        # cross-file isolation. An explicit Vitest setting must never be overridden.
        # One cell per Vitest major, so each runs in parallel with the other.
        if: matrix.gate == 'vitest-semantics'
        env:
          VN_SEMANTICS_VITEST: ${{ matrix.vitest }}
        run: bun run --filter vitest-native validate:vitest-semantics

      - name: Test packed consumer projects
        if: matrix.gate == 'consumers'
        run: bun run test:consumers


  # The one required check for this workflow. Branch protection used to list every
  # matrix leg by name, plus a docs-only job that echoed the same names, and the two
  # had to be kept in step by hand (a name neither reported left a PR unmergeable).
  # This job depends on every gate and runs whatever happened (`always()`): it fails
  # if any of them failed or was cancelled, and passes when they succeeded or were
  # skipped by condition — a docs-only pull request, or `changeset` on a push to main.
  # needs.<job>.result is one of success, failure, cancelled, skipped (GitHub Actions
  # contexts reference).
  verdict:
    name: CI verdict
    needs: [classify, changeset, check, packed]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
