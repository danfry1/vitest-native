name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A force-push to a PR branch previously left the superseded run executing to
# completion alongside the new one. Cancel superseded runs on PR refs; keep
# main pushes uncancelled so every landed commit gets a full verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changeset:
    name: Changeset for shipped changes
    # Pull requests only: the check compares against the base branch, and a push to
    # main has already been through this on its way in.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Its own job with full history rather than fetch-depth: 0 on the matrix, which
      # would make every leg clone the whole repository to serve one diff.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require a changeset when shipped source changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node packages/vitest-native/scripts/check-changeset.mjs "$BASE_SHA" "$HEAD_SHA"

  check:
    name: Full gate (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        # RNTL 14 (the lockfile version) requires Node >=22.13, so the Node 20 legs
        # double as the lower-bound back-compat corners: they pin RNTL 12 and 13 — the
        # versions Node 20 users run — to prove the full supported peer range (>=12
        # <15) and the Node floor on every push. The hot runtime and cross-check are
        # calibrated on the current RNTL and run only on the RNTL 14 legs (step `if`s).
        include:
          - os: ubuntu-latest
            node-version: 20.19.4
            rntl: '12'
          - os: ubuntu-latest
            node-version: 20.19.4
            rntl: '13'
          - os: ubuntu-latest
            node-version: 22.13.0
          - os: macos-latest
            node-version: 22.13.0
          - os: windows-latest
            node-version: 22.13.0
          # Node 24 is the current release line and the matrix stopped at 22, which is
          # how a workspace-level Vitest mismatch went unnoticed locally for a whole
          # session. Everything runs here, hot runtime included.
          - os: ubuntu-latest
            node-version: 24.13.0

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      # Package-download cache: bun still verifies against the frozen lockfile,
      # it just skips re-downloading unchanged tarballs.
      - name: Cache bun downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # vitest-native's own on-disk caches (the Babel transform of the RN graph +
      # the V8 compile cache) live under node_modules/.cache/vitest-native and are
      # content/version-keyed internally, so restoring a stale snapshot is safe —
      # outdated entries simply miss. Restored after install (bun may reshape
      # node_modules), saved automatically post-job.
      - name: Cache vitest-native transform output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/vitest-native/node_modules/.cache/vitest-native
          key: vn-transform-${{ runner.os }}-node${{ matrix.node-version }}-${{ hashFiles('bun.lock') }}
          restore-keys: vn-transform-${{ runner.os }}-node${{ matrix.node-version }}-

      - name: Verify dependencies are pinned
        run: bun run lint:deps

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck

      # Lint/format/typecheck above run against the locked RNTL (14); pin the
      # back-compat leg to its target RNTL before building and running the suite.
      - name: Pin RNTL for the back-compat leg
        if: matrix.rntl
        run: bun add -d "@testing-library/react-native@${{ matrix.rntl }}" --cwd packages/vitest-native

      - name: Build
        run: bun run build

      - name: Enforce published package budget
        if: runner.os == 'Linux' && matrix.node-version == '22.13.0' && !matrix.rntl
        run: bun run --filter vitest-native check:size

      - name: React Native API coverage (pinned RN)
        # The README claims the mock engine covers every stable React Native export.
        # check-compat is what backs that claim, and it ran only in the weekly
        # compat-check workflow — against react-native@latest, never against the
        # version actually pinned here. So a pull request that moved the pinned RN
        # could add stable exports the mock does not cover and still go green, with
        # the gap surfacing days later as a canary failure against a different
        # version. One leg is enough: RN is identical across the matrix, only RNTL
        # varies. The canary keeps its own edge run.
        if: runner.os == 'Linux' && matrix.node-version == '22.13.0' && !matrix.rntl
        run: bun run --filter vitest-native check-compat

      - name: Test
        run: bun run test

      - name: Native engine tests
        run: bun run test:native

      - name: Native engine tests (forks pool)
        # When a project configures a VM pool the plugin throws and points at 'threads'
        # or 'forks'. Nothing ran the forks pool, so that advice was untested — and the
        # engine's module hooks have to install in a child process just as they do in a
        # worker thread. Cheap (a couple of seconds) for advice the plugin gives in an
        # error message.
        run: bun run test:native:forks

      - name: Native engine tests (navigation preset)
        run: bun run test:native:navigation

      - name: Native engine tests (Android)
        run: bun run test:native:android

      - name: Native engine remediation advice
        # The explainer tells users to add a package to `transform: [...]` when Node
        # cannot parse its source — the most common migration blocker. That advice was
        # only ever asserted as a substring of the error message; this applies it.
        run: bun run test:native:advice

      - name: Native engine tests (hot runtime)
        # The hot runtime rides @experimental Vitest internals (vitest/worker,
        # ThreadsPoolWorker, poolRunner) — the most churn-prone surface we depend
        # on, so gate it on every PR, not just the weekly matrix.
        #
        # Runs on the back-compat legs too. It used to skip them as "covered on the
        # RNTL 14 legs", which was wrong: the resident-module keep-list has entries
        # that only matter on older RNTL, and removing them fails this suite under
        # RNTL 13 while RNTL 14 stays green (see native/module-reset.mjs). The hot
        # runtime was in fact fine on RNTL 12/13 — nothing was checking.
        run: bun run test:native:hot

      - name: Native engine hot-runtime isolation
        if: ${{ !matrix.rntl }}
        run: bun run test:native:hot:isolation

      - name: Native engine hot-runtime soak and recycling
        if: ${{ !matrix.rntl }}
        run: bun run test:native:hot:soak

      - name: Hot runtime equals default engine at scale
        # The only check that compares the two engines file-for-file over a
        # generated app-shaped corpus, and the only one that fails on a
        # hot-specific correctness delta. It ran in no workflow and was absent from
        # prepublishOnly, so the invariant it protects survived on the habit of
        # running it by hand — while the code comments that cite its numbers named
        # it as the way to catch a regression the gated suites let through.
        if: runner.os == 'Linux' && matrix.node-version == '22.13.0' && !matrix.rntl
        run: bun run --filter vitest-native validate:hot-parity

      - name: Cross-check (mock ≡ real RN) + fidelity report freshness
        # The cross-check is calibrated on the current RNTL (14); a few probes track
        # RNTL-version-specific real-RN behavior, so it runs only on the RNTL 14 legs.
        # fidelity:check runs the cross-check AND fails if the published fidelity
        # page/badge no longer match the live corpus (run `bun run fidelity:report`).
        if: ${{ !matrix.rntl }}
        run: bun run fidelity:check

      - name: Test example app
        run: bun run test:example

      # The consumer gate installs each fixture with npm. Node 22.13.0 bundles npm
      # 10.9.2, whose arborist crashes with "Cannot read properties of null (reading
      # 'edgesOut')" on these fixtures' dependency graphs. It is not this package:
      # a fixture with vitest-native removed entirely crashes the same way, and the
      # commit that passed on 2026-07-27 fails on re-run with no code change, so a
      # republished transitive dependency started tripping the bug. npm 11 installs
      # all of them.
      - name: Use an npm without the arborist edgesOut bug
        if: runner.os == 'Linux' && matrix.node-version == '22.13.0'
        run: npm install -g npm@11

      - name: Test packed consumer projects
        if: runner.os == 'Linux' && matrix.node-version == '22.13.0'
        run: bun run test:consumers

      - name: Check package exports
        if: runner.os == 'Linux' && matrix.node-version == '22.13.0'
        run: bun run check:exports
