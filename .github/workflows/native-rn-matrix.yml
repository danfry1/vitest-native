name: Native engine — Vitest × RN matrix

# The native engine's trust rests on two moving dependencies, and this matrix pins
# both axes. Every cell runs on each push to main, weekly, and on manual runs; a pull
# request runs the ends of the React Native range in every column (see
# .github/scripts/rn-matrix.mjs), or every cell when it changes the matrix itself:
#
#  • React Native (rows). The engine runs REAL RN JS and mocks only the ~7-module
#    native boundary, so it is sensitive to RN-version drift (the boundary has
#    broken before on SectionList / RendererProxy changes between minors).
#    Supported range (verified): RN 0.81–0.87. 0.80 and earlier fail host-component
#    detection and are below the floor; latest is canaried in compat-check.yml.
#    The rows and columns are defined once, in .github/rn-matrix.json. Keep the
#    newest row in sync with the lockfile RN version — the fidelity page derives its
#    published claim from that file (scripts/fidelity-report.mjs), so a stale matrix
#    publishes an understated range.
#
#  • Vitest (columns). Vitest churn is what bit-rotted the predecessor plugin
#    (vitest-community/vitest-react-native) — and the hot runtime rides Vitest's
#    @experimental internals (vitest/worker, ThreadsPoolWorker, poolRunner), the
#    most churn-prone surface we depend on. Every column is blocking — `RN matrix
#    verdict` below is a required check — because the declared peer range (>=4 <6)
#    promises every one of them: the lockfile version and the newest Vitest 5
#    release on every row, and the newest Vitest 4.x on the RN range's two ends —
#    it varies the RUNNER, and the RN axis is already covered fourteen ways by the
#    other columns.
#
# Every cell runs the native suite STOCK and HOT, plus the mock-vs-real-RN
# cross-check — the full real-RN gate against that (Vitest, RN) pair.
#
# RNTL is the third dependency but is pinned to the lockfile version (14) here, not
# matrixed — the supported peer range (>=12 <15) is proven by the Node 20 / RNTL 13
# back-compat leg in ci.yml, since RNTL 14 requires Node >=22.13.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The merge queue tests each queued group before it lands; every required check
  # must report on it, or the group waits forever.
  merge_group:
  workflow_dispatch:
  schedule:
    # Weekly, to catch new Vitest releases and RN patch releases within range.
    - cron: '0 9 * * 1'

permissions:
  contents: read

# Cancel superseded runs on PR refs (a force-push previously left 10+ stale
# cells running to completion); keep main/scheduled runs uncancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Docs-only pull requests skip the matrix, by the same rules as ci.yml
  # (.github/scripts/classify-change.sh). The skip is a job condition, not an
  # `on.pull_request.paths` filter: a workflow skipped by a path filter leaves its
  # checks pending and blocks a required check, while a job skipped by a condition
  # reports success (GitHub Docs, "Troubleshooting required status checks").
  # Pushes to main always run in full: they seed the caches pull requests restore,
  # and pages.yml publishes the fidelity matrix from the latest successful main run.
  classify:
    name: Classify change
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs-only: ${{ steps.docs.outputs.docs-only }}
      matrix: ${{ steps.cells.outputs.matrix }}
      scope: ${{ steps.cells.outputs.scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: docs
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: .github/scripts/classify-change.sh "$EVENT" "$BASE_SHA" "$HEAD_SHA"
      # Pull requests run the ends of the React Native range in every Vitest column;
      # main, the weekly schedule and manual runs run every cell. The cells are defined
      # once in .github/rn-matrix.json (see .github/scripts/rn-matrix.mjs).
      - id: cells
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: node .github/scripts/rn-matrix.mjs "$EVENT" "$BASE_SHA" "$HEAD_SHA"

  matrix:
    name: native+hot — vitest ${{ matrix.vitest }} × RN ${{ matrix.rn }}
    needs: classify
    if: needs.classify.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    # Without a bound, a hung cell (e.g. a stuck hot-soak worker) burns the
    # 360-minute default. A healthy cell finishes well under 15 minutes.
    timeout-minutes: 30
    strategy:
      # Report every cell independently rather than stopping at the first failure.
      fail-fast: false
      # .github/rn-matrix.json: React Native rows × Vitest columns, plus the Vitest 4
      # floor against the oldest and newest supported React Native.
      matrix: ${{ fromJSON(needs.classify.outputs.matrix) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.13.0'

      # Package-download cache: bun still verifies against the frozen lockfile,
      # it just skips re-downloading unchanged tarballs.
      - name: Cache bun downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The install-age gate (bunfig.toml minimumReleaseAge) is respected here too:
      # we deliberately stay >=7 days behind. RN 0.81-0.85 are long past that.
      - name: Pin react-native + babel-preset to ${{ matrix.rn }}
        run: |
          bun add -d "react-native@${{ matrix.rn }}" "@react-native/babel-preset@${{ matrix.rn }}" --cwd packages/vitest-native

      # vitest-native's on-disk caches (Babel transform of the RN graph + V8
      # compile cache), keyed per matrix cell — each cell transforms a different
      # RN version. Entries are content/version-keyed internally, so a stale
      # restore is a miss, never a wrong hit. Restored after the version pins
      # (bun add reshapes node_modules), saved automatically post-job.
      - name: Cache vitest-native transform output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/vitest-native/node_modules/.cache/vitest-native
          key: vn-transform-${{ runner.os }}-rn${{ matrix.rn }}-vitest-${{ matrix.vitest }}-${{ hashFiles('bun.lock') }}
          restore-keys: vn-transform-${{ runner.os }}-rn${{ matrix.rn }}-vitest-${{ matrix.vitest }}-

      - name: Pin Vitest to the newest supported 5.x release
        if: matrix.vitest == 'latest-supported'
        # Bump the coverage provider in lockstep — a mismatched @vitest/coverage-v8
        # vs vitest fails to load (provider 4.1.x + runtime 4.0.x has bitten us).
        # bunfig's minimumReleaseAge still applies: the newest 5.x at least a week old.
        run: |
          bun add -d "vitest@^5" "@vitest/coverage-v8@^5" --cwd packages/vitest-native

      - name: Pin Vitest to the newest 4.x release
        if: matrix.vitest == 'v4'
        # The supported range is >=4 <6 and the lockfile tracks 5.x, so the 4.x floor
        # is exercised explicitly.
        run: |
          bun add -d "vitest@^4" "@vitest/coverage-v8@^4" --cwd packages/vitest-native

      - name: Resolved versions
        run: |
          node -e "console.log('react-native            ', require('./packages/vitest-native/node_modules/react-native/package.json').version)"
          node -e "console.log('@react-native/babel-preset', require('./packages/vitest-native/node_modules/@react-native/babel-preset/package.json').version)"
          node -e "console.log('vitest                  ', require('./packages/vitest-native/node_modules/vitest/package.json').version)"

      - name: Build
        run: bun run build

      - name: Native engine tests (stock isolate:true)
        run: bun run test:native

      - name: Native engine tests (navigation preset)
        run: bun run test:native:navigation

      - name: Native engine tests (Android resolution)
        run: bun run test:native:android

      - name: Native engine tests (hot runtime)
        run: bun run test:native:hot

      - name: Native engine hot-runtime isolation
        run: bun run test:native:hot:isolation

      - name: Native engine hot-runtime soak and recycling
        run: bun run test:native:hot:soak

      - name: Cross-check (mock ≡ real RN ${{ matrix.rn }})
        run: bun run crosscheck

      # The per-cell report feeds the published fidelity matrix (pages.yml pulls
      # the latest successful run's artifacts and renders
      # website/guide/fidelity-matrix.md at deploy time). Uploaded on failure
      # too — a diverging cell's report is the forensic record.
      - name: Upload cross-check report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crosscheck-report-rn${{ matrix.rn }}-${{ matrix.vitest }}
          path: packages/vitest-native/crosscheck/.out/report.json
          if-no-files-found: ignore
          retention-days: 30

  # The one required check for this workflow, so branch protection does not list 16
  # cell names that change whenever a row is added. Fails if any cell failed or was
  # cancelled; passes when every cell succeeded or the matrix was skipped as
  # docs-only. Same pattern as `CI verdict` in ci.yml.
  verdict:
    name: RN matrix verdict
    needs: [classify, matrix]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null
