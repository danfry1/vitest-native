name: Native engine — Vitest × RN matrix

# The native engine's trust rests on two moving dependencies, and this matrix pins
# both axes. Every cell runs on each push to main, weekly, and on manual runs; a pull
# request runs the ends of the React Native range in every column (see
# .github/scripts/rn-matrix.mjs), or every cell when it changes the matrix itself:
#
#  • React Native (rows). The engine runs REAL RN JS and mocks only the ~7-module
#    native boundary, so it is sensitive to RN-version drift (the boundary has
#    broken before on SectionList / RendererProxy changes between minors).
#    Supported range: RN 0.86–0.88 (0.86 is Expo SDK 57's; docs/versioning.md). Below
#    it the native engine stops with UNSUPPORTED_PEER; latest is canaried in
#    compat-check.yml.
#    The rows and columns are defined once, in .github/rn-matrix.json. Keep the
#    newest row in sync with the lockfile RN version — the fidelity page derives its
#    published claim from that file (scripts/fidelity-report.mjs), so a stale matrix
#    publishes an understated range.
#
#  • Vitest (columns). Vitest churn is what bit-rotted the predecessor plugin
#    (vitest-community/vitest-react-native) — and the hot runtime rides Vitest's
#    @experimental internals (vitest/worker, ThreadsPoolWorker, poolRunner), the
#    most churn-prone surface we depend on. Every column is blocking — `RN matrix
#    verdict` below is a required check — because the declared peer range (>=5 <6)
#    promises every one of them: the lockfile version and the newest Vitest 5
#    release on every row. The latest-supported column also takes Vite and React
#    Native Testing Library to their newest supported releases.
#
# Every cell runs the native suite STOCK and HOT, plus the mock-vs-real-RN
# cross-check — the full real-RN gate against that (Vitest, RN) pair.
#
# RNTL is the third dependency but is pinned to the lockfile version (14) here, not
# matrixed — the supported peer range (>=13 <15) is proven by the RNTL 13
# back-compat leg in ci.yml.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The merge queue tests each queued group before it lands; every required check
  # must report on it, or the group waits forever.
  merge_group:
  workflow_dispatch:
  schedule:
    # Weekly, to catch new Vitest releases and RN patch releases within range.
    - cron: "0 9 * * 1"

permissions:
  contents: read

# Cancel superseded runs on PR refs (a force-push previously left 10+ stale
# cells running to completion); keep main/scheduled runs uncancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Pull requests run the matrix only when their changed files need it, by the same
  # rules as ci.yml (.github/scripts/classify-change.mjs). The skip is a job condition, not an
  # `on.pull_request.paths` filter: a workflow skipped by a path filter leaves its
  # checks pending and blocks a required check, while a job skipped by a condition
  # reports success (GitHub Docs, "Troubleshooting required status checks").
  # Pushes to main always run in full: they seed the caches pull requests restore,
  # and pages.yml publishes the fidelity matrix from the latest successful main run.
  classify:
    name: Classify change
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rn: ${{ steps.docs.outputs.rn }}
      matrix: ${{ steps.cells.outputs.matrix }}
      scope: ${{ steps.cells.outputs.scope }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: docs
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: node .github/scripts/classify-change.mjs "$EVENT" "$BASE_SHA" "$HEAD_SHA"
      # Pull requests run the ends of the React Native range in every Vitest column;
      # main, the weekly schedule and manual runs run every cell. The cells are defined
      # once in .github/rn-matrix.json (see .github/scripts/rn-matrix.mjs).
      - id: cells
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: node .github/scripts/rn-matrix.mjs "$EVENT" "$BASE_SHA" "$HEAD_SHA"

  matrix:
    name: native+hot — vitest ${{ matrix.vitest }} × RN ${{ matrix.rn }}
    needs: classify
    if: needs.classify.outputs.rn != 'false'
    runs-on: ubuntu-latest
    # Without a bound, a hung cell (e.g. a stuck hot-soak worker) burns the
    # 360-minute default. A healthy cell finishes well under 15 minutes.
    timeout-minutes: 30
    strategy:
      # Report every cell independently rather than stopping at the first failure.
      fail-fast: false
      # .github/rn-matrix.json: React Native rows × Vitest columns.
      matrix: ${{ fromJSON(needs.classify.outputs.matrix) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.22.3"

      # Package-download cache: bun still verifies against the frozen lockfile,
      # it just skips re-downloading unchanged tarballs.
      - name: Cache bun downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The install-age gate (bunfig.toml minimumReleaseAge) is respected here too:
      # we deliberately stay >=7 days behind. The supported rows are long past that.
      - name: Pin react-native + babel-preset to ${{ matrix.rn }}
        env:
          RN_VERSION: ${{ matrix.rn }}
        run: |
          bun add -d "react-native@$RN_VERSION" "@react-native/babel-preset@$RN_VERSION" --cwd packages/vitest-native

      # vitest-native's on-disk caches (Babel transform of the RN graph + V8
      # compile cache), keyed per matrix cell — each cell transforms a different
      # RN version. Entries are content/version-keyed internally, so a stale
      # restore is a miss, never a wrong hit. Restored after the version pins
      # (bun add reshapes node_modules), saved automatically post-job.
      - name: Cache vitest-native transform output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/vitest-native/node_modules/.cache/vitest-native
          key: vn-transform-${{ runner.os }}-rn${{ matrix.rn }}-vitest-${{ matrix.vitest }}-${{ hashFiles('bun.lock') }}
          restore-keys: vn-transform-${{ runner.os }}-rn${{ matrix.rn }}-vitest-${{ matrix.vitest }}-

      - name: Pin each peer to the newest supported release
        if: matrix.vitest == 'latest-supported'
        # Vitest (with its coverage provider in lockstep: a provider and runtime from
        # different releases fail to load), Vite and React Native Testing Library, each at
        # the newest release of its newest supported major. The specs come from the
        # package's peer requirements, so this column follows a range change
        # (.github/scripts/latest-supported.mjs, docs/upstream-policy.md).
        # bunfig's minimumReleaseAge still applies: each at least a week old.
        run: |
          specs=$(node .github/scripts/latest-supported.mjs)
          echo "Installing: $specs"
          bun add -d $specs --cwd packages/vitest-native

      - name: Resolved versions
        run: |
          node -e "console.log('react-native            ', require('./packages/vitest-native/node_modules/react-native/package.json').version)"
          node -e "console.log('@react-native/babel-preset', require('./packages/vitest-native/node_modules/@react-native/babel-preset/package.json').version)"
          node -e "console.log('vitest                  ', require('./packages/vitest-native/node_modules/vitest/package.json').version)"
          node -e "console.log('vite                    ', require('./packages/vitest-native/node_modules/vite/package.json').version)"
          node -e "console.log('@testing-library/react-native', require('./packages/vitest-native/node_modules/@testing-library/react-native/package.json').version)"

      - name: Build
        run: bun run build

      - name: Native engine tests (stock isolate:true)
        run: bun run test:native

      - name: Native engine tests (navigation preset)
        run: bun run test:native:navigation

      - name: Native engine tests (Android resolution)
        run: bun run test:native:android

      - name: Native engine tests (hot runtime)
        run: bun run test:native:hot

      - name: Native engine hot-runtime isolation
        run: bun run test:native:hot:isolation

      - name: Native engine hot-runtime soak and recycling
        run: bun run test:native:hot:soak

      - name: Cross-check (mock ≡ real RN ${{ matrix.rn }})
        run: bun run crosscheck

      # The per-cell report feeds the published fidelity matrix (pages.yml pulls
      # the latest successful run's artifacts and renders
      # website/guide/fidelity-matrix.md at deploy time). Uploaded on failure
      # too — a diverging cell's report is the forensic record.
      - name: Upload cross-check report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crosscheck-report-rn${{ matrix.rn }}-${{ matrix.vitest }}
          path: packages/vitest-native/crosscheck/.out/report.json
          if-no-files-found: ignore
          retention-days: 30

  # The one required check for this workflow, so branch protection does not list 16
  # cell names that change whenever a row is added. Fails if any cell failed or was
  # cancelled; passes when every cell succeeded or the matrix was skipped because
  # the pull request's changes do not need it. Same pattern as `CI verdict` in ci.yml.
  verdict:
    name: RN matrix verdict
    needs: [classify, matrix]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")' > /dev/null

  # Publishes the fidelity matrix for the docs site. Vercel's build has no GitHub token, so
  # it cannot read this run's artifacts; this job renders the page from them and pushes it,
  # as a single commit, to the `site-data` branch, which the site's build fetches publicly
  # (website/scripts/fetch-fidelity-matrix.mjs). Only a run on main that is not a pull
  # request or a merge-queue group publishes: those execute code from the change itself.
  publish-site-data:
    name: Publish fidelity matrix
    needs: matrix
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      github.event_name != 'merge_group' &&
      needs.matrix.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # One publish at a time, in order; a newer run's page replaces an older one's.
    concurrency:
      group: site-data
      cancel-in-progress: false
    permissions:
      # Pushes only refs/heads/site-data (below); main is protected by its ruleset.
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Render the fidelity matrix from this run's reports
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --pattern 'crosscheck-report-*' --dir "$RUNNER_TEMP/reports"
          mkdir -p "$RUNNER_TEMP/site-data"
          node packages/vitest-native/scripts/fidelity-matrix.mjs \
            --reports "$RUNNER_TEMP/reports" --out "$RUNNER_TEMP/site-data/fidelity-matrix.md"
      - name: Push it to the site-data branch
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: ${{ runner.temp }}/site-data
        run: |
          git init -q -b site-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The branch holds data, not a site: Vercel must not deploy it.
          printf '{ "git": { "deploymentEnabled": false } }\n' > vercel.json
          git add fidelity-matrix.md vercel.json
          git commit -q -m "Fidelity matrix from run $GITHUB_RUN_ID ($GITHUB_SHA)"
          # The token goes in a header, not the URL, so no git message can print it.
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.extraheader="$auth" push -q --force \
            "https://github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/site-data
