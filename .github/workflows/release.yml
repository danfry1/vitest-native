name: Release

on:
  push:
    tags:
      - "v*"

permissions: read-all

# Two jobs, so the one holding publish credentials runs nothing an install could have
# planted. `verify` runs the whole gate, including the packed consumer fixtures, which
# install floating dependency ranges fresh from the registry; it has read-only
# permissions. `publish` holds `id-token: write` (npm trusted publishing) and
# `contents: write` (the GitHub release). It rebuilds from the tagged commit with the
# frozen lockfile and no lifecycle scripts, publishes only a tarball byte-identical to
# the one `verify` tested, and never installs anything the lockfile does not pin.
jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 35
    if: github.repository == 'danfry1/vitest-native'
    permissions:
      contents: read
    outputs:
      tarball-sha256: ${{ steps.pack.outputs.sha256 }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: the tag-on-main gate compares the tagged commit against
          # origin/main, which a shallow checkout cannot see.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          no-cache: true
          bun-version: 1.3.14

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: 22.22.3

      # Here only to fail a wrong tag before the test suite; `publish` runs it again.
      - name: Tag is on main and names the package version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: .github/scripts/release-gate.sh "$TAG_NAME"

      # The npm the packed consumer fixtures have always been installed with here,
      # checked against its published integrity.
      - run: node .github/scripts/install-global.mjs npm 11.15.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify dependencies are pinned
        run: bun run lint:deps

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck

      # Build before the tests: the native-engine test config imports the built
      # plugin from ../dist (matches ci.yml, which builds before testing).
      - name: Build
        run: bun run build

      # The tarball this job tests. `publish` builds its own and refuses to publish
      # unless the two are byte-identical (the build is reproducible from the lockfile).
      - name: Pack the tested tarball
        id: pack
        working-directory: packages/vitest-native
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/pack"
          echo "sha256=$(sha256sum "$RUNNER_TEMP"/pack/*.tgz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Test (mock engine)
        run: bun run test

      - name: Test (native engine)
        run: bun run test:native

      - name: Test (native engine, Android)
        run: bun run test:native:android

      - name: Test (native hot runtime)
        run: bun run test:native:hot

      - name: Test (native hot-runtime isolation)
        run: bun run test:native:hot:isolation

      - name: Test (native hot-runtime soak and recycling)
        run: bun run test:native:hot:soak

      - name: Cross-check (mock ≡ real RN)
        run: bun run crosscheck

      - name: Test packed consumer projects
        run: bun run test:consumers

      - name: Test example app
        run: bun run test:example

      - name: Check package exports
        run: bun run check:exports

  publish:
    name: Publish
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.repository == 'danfry1/vitest-native'
    permissions:
      contents: write
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          no-cache: true
          bun-version: 1.3.14

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version: 22.22.3
          registry-url: https://registry.npmjs.org

      - name: Tag is on main and names the package version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: .github/scripts/release-gate.sh "$TAG_NAME"

      # A prerelease (0.14.0-rc.0) is published to the `next` dist-tag and marked as a
      # prerelease on GitHub; anything else goes to `latest`. npm 11 refuses a prerelease
      # without an explicit --tag (npm/cli#7910), so the tag is always passed. The notes
      # are the version's CHANGELOG section (its base version's, for a prerelease).
      - name: Release channel and notes
        id: channel
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: node packages/vitest-native/scripts/release-channel.mjs "${TAG_NAME#v}" --notes-file "$RUNNER_TEMP/release-notes.md" >> "$GITHUB_OUTPUT"

      # npm >= 11.15 is required for staged publishing (`npm stage`). Installed from its
      # tarball after checking it against the integrity npm published for it
      # (.github/scripts/install-global.mjs), so the npm that runs with the publish token is
      # exactly that release. Its dependencies are all bundled in the tarball, so nothing
      # else is fetched.
      - name: npm 11.15.0, checked against its published integrity
        run: node .github/scripts/install-global.mjs npm 11.15.0

      # The lockfile pins every package and its integrity; --ignore-scripts runs no
      # package's lifecycle scripts (the build does not need any).
      - name: Install dependencies (lockfile only, no scripts)
        run: bun install --frozen-lockfile --ignore-scripts

      # The build runs the installed tsdown (`bun --bun tsdown`), which fails rather than
      # fetching one when it is missing. Say so plainly here, before the build.
      - name: The build's tsdown comes from the lockfile
        run: |
          if [ ! -x packages/vitest-native/node_modules/.bin/tsdown ]; then
            echo "::error::tsdown is not installed from the lockfile."
            exit 1
          fi

      - name: Build
        run: bun run build

      - name: Pack, and require the tarball verify tested
        working-directory: packages/vitest-native
        env:
          TESTED_SHA256: ${{ needs.verify.outputs.tarball-sha256 }}
        run: |
          mkdir -p "$RUNNER_TEMP/pack"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/pack"
          actual=$(sha256sum "$RUNNER_TEMP"/pack/*.tgz | cut -d' ' -f1)
          if [ "$actual" != "$TESTED_SHA256" ]; then
            echo "::error::The tarball built here ($actual) is not the one verify tested ($TESTED_SHA256)."
            exit 1
          fi

      - name: Stage publish to npm
        working-directory: packages/vitest-native
        # Publishes this directory, as before; npm packs it exactly as the step above
        # did. Uploads the tarball to npm's stage queue. Provenance is auto-generated
        # via OIDC trusted publishing (id-token: write). The version is NOT
        # installable until a maintainer approves it with a 2FA challenge:
        #   npm stage approve <id>   (or approve on npmjs.com)
        # --ignore-scripts: the package's prepublishOnly runs the whole test suite,
        # packed consumer installs included, which is verify's job, not this one's.
        env:
          DIST_TAG: ${{ steps.channel.outputs.dist-tag }}
        run: npm stage publish --tag "$DIST_TAG" --ignore-scripts

      - name: Staged-publish approval reminder
        run: echo "::notice::Version staged to npm. Approve it (npm stage approve <id>, or on npmjs.com) with 2FA to make it installable."

      # The CHANGELOG section first (what changed, and how to upgrade), then GitHub's
      # generated list of merged pull requests: `--notes-file` is prepended to
      # `--generate-notes`.
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          PRERELEASE: ${{ steps.channel.outputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags=(--prerelease --latest=false); fi
          gh release create "$TAG_NAME" --notes-file "$RUNNER_TEMP/release-notes.md" --generate-notes "${flags[@]}"
