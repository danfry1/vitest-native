name: Pages

# GitHub Pages serves the old address, danfry1.github.io/vitest-native, as a redirect site:
# every page sends the reader to the same page on the docs' own domain, anchor included
# (website/scripts/redirect-site.mjs). Released versions print links to the old address,
# so this site must stay up. A manual run with `full_site` deploys the whole site here
# instead, for when the new domain is down; the next push that runs this workflow puts the
# redirects back.
on:
  push:
    branches: [main]
    # What the published site is built from; tests/site-inputs.test.ts holds this list to
    # the build's own imports, and to website/scripts/skip-unless-site-changed.sh.
    paths:
      - 'website/**'
      - 'package.json'
      - 'bun.lock'
      - 'packages/vitest-native/src/docs-url.mjs'
      - 'packages/vitest-native/src/errors.mjs'
      - 'packages/vitest-native/src/node-range.ts'
      - 'packages/vitest-native/src/peer-requirements.ts'
      - 'packages/vitest-native/tests/rn-conformance/**'
      - 'packages/vitest-native/validation/bug-museum/exhibits.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
    inputs:
      full_site:
        description: Deploy the full site at the old address instead of the redirects
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      # The build lists the pages to redirect. A full site is served under /vitest-native/.
      - name: Build website
        env:
          SITE_BASE: ${{ inputs.full_site && '/vitest-native/' || '/' }}
        run: bun run build:website

      - name: Write the redirect site
        if: ${{ !inputs.full_site }}
        run: node website/scripts/redirect-site.mjs website/.vitepress/dist "$RUNNER_TEMP/redirect-site"

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ inputs.full_site && 'website/.vitepress/dist' || format('{0}/redirect-site', runner.temp) }}

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
