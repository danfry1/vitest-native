name: Compatibility Check

on:
  schedule:
    # Every Monday at 9am UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  expo-module-table:
    name: Expo module tables match the newest jest-expo of each SDK
    runs-on: ubuntu-latest
    # Read-only: compat-report (below) files the issue.
    permissions:
      contents: read
    # The native engine answers Expo native modules from jest-expo's table for the
    # installed SDK (packages/vitest-native/src/native/expo-module-table-<sdk>.mjs). A new
    # jest-expo of a committed SDK, or a new SDK on npm's latest tag, fails this job so the
    # table is adopted deliberately: run the command the job prints and review the diff.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22.3'
      - name: Compare with the newest jest-expo of each SDK
        run: node packages/vitest-native/scripts/sync-expo-module-table.mjs --check


  check-latest-rn:
    name: Check against current React Native edge
    runs-on: ubuntu-latest
    # Read-only: it installs and runs unaged releases. compat-report (below) files the issue.
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22.3'

      - name: Install with latest react-native
        # This scheduled edge job intentionally bypasses the seven-day adoption
        # gate. Blocking release tests remain pinned and deterministic.
        # metro-resolver rides along: tests/metro-resolver-oracle.test.ts checks
        # platform-file resolution against the real resolver, so this edge job
        # doubles as the upstream-drift detector for Metro's resolution order
        # while the PR gate stays pinned and deterministic.
        run: |
          bun install --frozen-lockfile
          bun add -d react-native@latest @react-native/babel-preset@latest metro-resolver@latest --minimum-release-age=0 --ignore-scripts --cwd packages/vitest-native

      - name: Resolved versions
        run: |
          node -e "console.log('react-native            ', require('./packages/vitest-native/node_modules/react-native/package.json').version)"
          node -e "console.log('@react-native/babel-preset', require('./packages/vitest-native/node_modules/@react-native/babel-preset/package.json').version)"

      - name: Build
        run: bun run --filter vitest-native build

      - name: Run tests
        run: bun run --filter vitest-native test

      - name: Run native engine tests
        run: bun run test:native

      - name: Run navigation preset tests
        run: bun run test:native:navigation

      - name: Run Android resolution tests
        run: bun run test:native:android

      - name: Run remediation-advice tests
        run: bun run test:native:advice

      - name: Run native hot-runtime tests
        run: bun run test:native:hot

      - name: Run hot-runtime isolation tests
        run: bun run test:native:hot:isolation

      - name: Run hot-runtime soak and recycling
        run: bun run test:native:hot:soak

      - name: Check API compatibility
        run: |
          expected=$(node -p "require('./packages/vitest-native/node_modules/react-native/package.json').version")
          VITEST_NATIVE_EXPECTED_RN_VERSION="$expected" bun run --filter vitest-native check-compat


  canary:
    name: Canary (${{ matrix.channel }})
    runs-on: ubuntu-latest
    # Upstream's next releases, before they ship (docs/upstream-policy.md): the newest of
    # each package's `next`/`beta`/`rc` channels ahead of `latest`
    # (.github/scripts/canary-version.mjs). A channel with nothing ahead is skipped. Like the
    # edge job above, this installs releases younger than the seven-day gate, in this job
    # only; the pull-request gates stay pinned.
    # Read-only: it installs and runs unaged prereleases. compat-report (below) files the issue.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: vitest
            node: 22.22.3
          - channel: react-native
            node: 22.22.3
          - channel: node-next
            # setup-node's newest line, prereleases included (v27 alpha at the time of writing).
            node: current

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}

      - name: Pick and install the prerelease
        id: pick
        env:
          CHANNEL: ${{ matrix.channel }}
        run: |
          case "$CHANNEL" in
            vitest)
              v=$(node .github/scripts/canary-version.mjs vitest)
              if [ -z "$v" ]; then echo "No Vitest prerelease ahead of latest."; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; fi
              vite=$(node .github/scripts/canary-version.mjs vite); vite=${vite:-latest}
              # A next major is refused at startup by design; this job asks whether it would work.
              node .github/scripts/raise-peer-ceiling.mjs vitest "$v"
              [ "$vite" != latest ] && node .github/scripts/raise-peer-ceiling.mjs vite "$vite"
              bun add -d "vitest@$v" "@vitest/coverage-v8@$v" "vite@$vite" --minimum-release-age=0 --ignore-scripts --cwd packages/vitest-native
              ;;
            react-native)
              v=$(node .github/scripts/canary-version.mjs react-native)
              if [ -z "$v" ]; then echo "No React Native prerelease ahead of latest."; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; fi
              bun add -d "react-native@$v" "@react-native/babel-preset@$v" metro-resolver@latest --minimum-release-age=0 --ignore-scripts --cwd packages/vitest-native
              ;;
            node-next)
              echo "Node $(node -v), the newest line setup-node offers."
              ;;
          esac
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Build
        if: steps.pick.outputs.skip != 'true'
        run: bun run build

      - name: Unit tests
        if: steps.pick.outputs.skip != 'true'
        run: bun run test

      - name: Native engine tests
        if: steps.pick.outputs.skip != 'true'
        run: bun run test:native

      - name: Native hot-runtime tests
        if: steps.pick.outputs.skip != 'true'
        run: bun run test:native:hot

  compat-report:
    name: File issues for failed checks
    # The only job that can write issues, and it runs no package code: it checks out one
    # file of this repository (the report script) and installs nothing. It reads this run's
    # job results and failed jobs' log tails through the API, so a compromised release
    # installed by a check above never holds a write token.
    needs: [expo-module-table, check-latest-rn, canary]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts/compat-report.mjs
          sparse-checkout-cone-mode: false

      - name: File or update an issue per failed check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7
        env:
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        with:
          script: |
            const { report } = await import(`${process.env.GITHUB_WORKSPACE}/.github/scripts/compat-report.mjs`);
            await report({ github, context, runUrl: process.env.RUN_URL });

  check-expo-latest-supported:
    name: Supported Expo SDKs at their newest patch
    runs-on: ubuntu-latest
    # The latest-supported axis for Expo (docs/upstream-policy.md): the packed consumer
    # fixtures for each supported SDK, with `expo` following its SDK and `expo install
    # --fix` aligning the rest. Unlike the edge job above, nothing installed is younger
    # than seven days (npm --before, set by scripts/test-consumers.mjs).
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node-version: 22.22.3

      - name: Use an npm without the arborist edgesOut bug
        run: npm install -g npm@11.20.0

      - name: Build
        run: bun run build

      - name: Expo SDKs at their newest patch
        env:
          VN_CONSUMERS: expo-latest
        run: bun run test:consumers

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7
        env:
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'compat-check',
            });
            const title = 'Compatibility: a supported Expo SDK fails at its newest patch';
            if (!issues.some((issue) => issue.title === title)) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: `The supported Expo SDKs, installed at their newest patch (at least seven days old), fail the packed consumer fixtures.\n\nRun: ${process.env.RUN_URL}`,
                labels: ['compat-check'],
              });
            }
