name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The merge queue tests each queued group before it lands; every required check
  # must report on it, or the group waits forever.
  merge_group:
  schedule:
    - cron: '0 6 * * 1' # Monday 6am UTC

permissions: read-all

# A new push to a pull request cancels the analysis of the one it replaces. Anything else
# has a group per commit, so no analysis of main waits behind, or is dropped for, another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: javascript-typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
