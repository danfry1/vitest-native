name: Set up vitest-native
description: >-
  Bun, Node, the bun download cache, a frozen install, and vitest-native's transform
  cache: the toolchain every gate job starts from. Checkout stays in the job, because a
  local action can only be used once the repository is checked out.

inputs:
  node-version:
    description: Node.js version for this job.
    required: true

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: 1.3.14

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}

    # Package-download cache: bun still verifies against the frozen lockfile, it just
    # skips re-downloading unchanged tarballs.
    - name: Cache bun downloads
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-${{ runner.os }}-

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile

    # vitest-native's own on-disk caches (the Babel transform of the RN graph + the V8
    # compile cache) live under node_modules/.cache/vitest-native and are
    # content/version-keyed internally, so restoring a stale snapshot is safe —
    # outdated entries simply miss. Restored after install (bun may reshape
    # node_modules), saved automatically post-job.
    - name: Cache vitest-native transform output
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: packages/vitest-native/node_modules/.cache/vitest-native
        key: vn-transform-${{ runner.os }}-node${{ inputs.node-version }}-${{ hashFiles('bun.lock') }}
        restore-keys: vn-transform-${{ runner.os }}-node${{ inputs.node-version }}-
