version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    # Supply-chain hardening: hold update PRs until a version has been public for
    # at least seven days, long enough for most malicious releases to be yanked.
    # Mirrors the install-time minimumReleaseAge gate in bunfig.toml.
    cooldown:
      default-days: 7
      semver-major-days: 7
      semver-minor-days: 7
      semver-patch-days: 7
    groups:
      # React and react-test-renderer are version-locked: react-test-renderer
      # refuses to run unless its version matches react's EXACTLY, and fails the
      # whole suite with "Incorrect version of react-test-renderer detected.
      # Expected 19.2.8, but found 19.2.7." They cannot be split across PRs.
      #
      # They were. `react` is a production dependency (apps/example declares it)
      # while `react-test-renderer` is a devDependency everywhere, so the two
      # dependency-type groups below put them in different pull requests by
      # construction — every react patch reddened one of them. Listed first so the
      # pattern match wins, and excluded below so the order is not load-bearing.
      react:
        patterns:
          - react
          - react-dom
          - react-test-renderer
        update-types: [major, minor, patch]
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
        exclude-patterns: [react, react-dom, react-test-renderer]
      production-dependencies:
        dependency-type: production
        update-types: [minor, patch]
        exclude-patterns: [react, react-dom, react-test-renderer]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    # One PR for all action bumps. Split PRs break lockstep-versioned actions:
    # github/codeql-action init/analyze/upload-sarif must move together, or the
    # Analyze job fails with "Loaded a configuration file for version X, but
    # running version Y" on every individual PR.
    groups:
      github-actions:
        patterns: ["*"]
