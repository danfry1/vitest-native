<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none">
  <!-- The boundary at tab size: two solid bars over one outlined bar, with no dashed line,
       which a 16 px tab cannot show. Follows the browser's light or dark theme. -->
  <style>
    .bar { fill: #17784a; }
    .native { stroke: #0a0a0a; }
    @media (prefers-color-scheme: dark) {
      .bar { fill: #4cd38a; }
      .native { stroke: #ededed; }
    }
  </style>
  <rect class="bar" x="1" y="1" width="14" height="4" rx="0.75"/>
  <rect class="bar" x="1" y="6" width="14" height="4" rx="0.75" opacity="0.62"/>
  <rect class="native" x="1.75" y="11.75" width="12.5" height="3.5" rx="0.75" stroke-width="1.5"/>
</svg>
